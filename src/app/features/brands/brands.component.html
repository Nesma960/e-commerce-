<section>
  <div
    class="overflow-hidden bg-linear-to-br from-blue-400 to-blue-600 px-7 w-full py-7 shadow-md sm:px-30 sm:py-15"
  >
    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-sm font-medium">
      <button
        class="cursor-pointer text-white/70 transition-colors duration-200 hover:text-white"
        routerLink="/"
      >
        Home
      </button>

      <span class="text-white/40">/</span>

      <span class="font-semibold text-white"> Brands </span>
    </div>

    <!-- Header Content -->
    <div class="mt-6 flex items-center gap-4 sm:mt-8 sm:gap-5">
      <!-- Icon -->
      <div
        class="flex size-14 shrink-0 items-center justify-center rounded-2xl bg-white/15 text-white shadow-lg ring-1 ring-white/20 backdrop-blur-sm sm:size-16"
      >
        <i class="fa-solid fa-tags text-2xl sm:text-3xl"></i>
      </div>

      <!-- Text -->
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white sm:text-3xl">Top Brands</h1>

        <p class="mt-1 text-sm font-medium text-white/60 sm:text-base">
          Shop from your favorite brands
        </p>
      </div>
    </div>
  </div>
</section>

<!-- brands -->
<section class="py-10">
  <div
    class="container grid grid-cols-1 gap-5 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6"
  >
    <!-- brand card -->
    @for (brand of brandsList(); track brand._id) {
      <div
        [routerLink]="['/products']"
        [queryParams]="{ brand: brand._id }"
        class="group relative cursor-pointer overflow-hidden rounded-xl border border-gray-100 bg-white p-4 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg"
      >
        <!-- Brand Image -->
        <div class="flex h-40 items-center justify-center overflow-hidden rounded-lg bg-gray-50">
          <img
            [src]="brand.image"
            [alt]="brand.name"
            [title]="brand.name"
            class="h-full w-full object-contain p-6 transition-transform duration-300 group-hover:scale-105"
          />
        </div>

        <!-- Brand Name -->
        <div class="py-4 text-center">
          <h3
            class="text-lg font-bold text-gray-800 transition-colors duration-300 group-hover:text-main-color"
          >
            {{ brand.name }}
          </h3>
        </div>

        <!-- Hover Button -->
        <div
          class="absolute inset-x-0 bottom-0 translate-y-full bg-white/95 px-4 py-3 backdrop-blur-sm transition-transform duration-300 group-hover:translate-y-0"
        >
          <div class="flex items-center justify-center gap-2 text-sm font-semibold text-main-color">
            <span>View Products</span>

            <i
              class="fa-solid fa-arrow-right text-xs transition-transform duration-300 group-hover:translate-x-1"
            ></i>
          </div>
        </div>
      </div>
    }
  </div>
</section>

<section class="border-y mb-4 border-main-color/10 bg-main-color/5">
  <div class="container grid grid-cols-1 gap-6 py-7 sm:grid-cols-2 lg:grid-cols-4 lg:gap-4">
    <!-- Free Shipping -->
    <div
      class="group flex items-center gap-4 transition-transform duration-300 hover:-translate-y-1"
    >
      <div
        class="flex size-12 shrink-0 items-center justify-center rounded-xl bg-main-color/10 transition-all duration-300 group-hover:bg-main-color/20"
      >
        <i class="fa-solid fa-truck text-xl text-second-color"></i>
      </div>

      <div class="flex flex-col">
        <strong class="text-sm font-bold text-gray-800"> Free Shipping </strong>

        <span class="mt-1 text-xs font-medium text-gray-500"> On orders over 500 EGP </span>
      </div>
    </div>

    <!-- Easy Returns -->
    <div
      class="group flex items-center gap-4 transition-transform duration-300 hover:-translate-y-1"
    >
      <div
        class="flex size-12 shrink-0 items-center justify-center rounded-xl bg-main-color/10 transition-all duration-300 group-hover:bg-main-color/20"
      >
        <i class="fa-solid fa-rotate-left text-xl text-second-color"></i>
      </div>

      <div class="flex flex-col">
        <strong class="text-sm font-bold text-gray-800"> Easy Returns </strong>

        <span class="mt-1 text-xs font-medium text-gray-500"> 14-day return policy </span>
      </div>
    </div>

    <!-- Secure Payment -->
    <div
      class="group flex items-center gap-4 transition-transform duration-300 hover:-translate-y-1"
    >
      <div
        class="flex size-12 shrink-0 items-center justify-center rounded-xl bg-main-color/10 transition-all duration-300 group-hover:bg-main-color/20"
      >
        <i class="fa-solid fa-shield-halved text-xl text-second-color"></i>
      </div>

      <div class="flex flex-col">
        <strong class="text-sm font-bold text-gray-800"> Secure Payment </strong>

        <span class="mt-1 text-xs font-medium text-gray-500"> 100% secure checkout </span>
      </div>
    </div>

    <!-- Customer Support -->
    <div
      class="group flex items-center gap-4 transition-transform duration-300 hover:-translate-y-1"
    >
      <div
        class="flex size-12 shrink-0 items-center justify-center rounded-xl bg-main-color/10 transition-all duration-300 group-hover:bg-main-color/20"
      >
        <i class="fa-solid fa-headset text-xl text-second-color"></i>
      </div>

      <div class="flex flex-col">
        <strong class="text-sm font-bold text-gray-800"> 24/7 Support </strong>

        <span class="mt-1 text-xs font-medium text-gray-500"> Contact us anytime </span>
      </div>
    </div>
  </div>
</section>
