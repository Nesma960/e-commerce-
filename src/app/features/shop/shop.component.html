<!-- product card -->

<section class="py-10">
  <div class="container 2xl:max-w-8xl text-center">
    <div class="tilte">
      <h2
        class="relative pl-4 text-2xl font-extrabold tracking-tight after:content-[''] after:absolute after:left-0 after:top-1/2 after:-translate-y-1/2 after:w-1.5 after:h-7 after:rounded-full after:bg-linear-to-b after:from-main-color after:to-second-color"
      >
        <span class="text-text-color">All </span>
        <span class="text-second-color">Products</span>
      </h2>
    </div>

    <div
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 mt-4 gap-4"
    >
      <!-- card -->
      @for (product of productList(); track product._id) {
        <app-card [product]="product" />
      }
    </div>
  </div>
</section>
